# kit-deploy · copied to the project as `.github/workflows/deploy-vps.yml`.
# On every push to the production branch: build the image, push it to GHCR, and ask kit-deploy
# to deploy that commit. On every pull request: the same image for the PR's head commit, deployed
# as that PR's preview (`pr-<n>`), which goes away when the PR is closed (merged or not).
# kit-deploy derives the image from the repo and the commit; the token only decides which project
# (`KIT_DEPLOY_TOKEN`, a repository secret piped from the VPS to `gh secret set`).
#
# `pull_request`, never `pull_request_target`: a PR's code must not run with the secrets. PRs from
# forks (and Dependabot's) get no secrets and a read-only GITHUB_TOKEN, so they get no preview.
name: Deploy (VPS)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# One run per branch or PR at a time: a newer push (or closing the PR) cancels the build in course.
concurrency:
  group: deploy-vps-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  KIT_DEPLOY_URL: https://deploy.fockus.dev

jobs:
  deploy:
    # Production (push, manual run) and a PR's preview (opened, synchronize, reopened) of this repo.
    if: >-
      github.event_name != 'pull_request' || (
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # On a PR, the head commit (what the author pushed), not the merge commit GitHub makes:
      # the image, the deployment and U7's status all name this sha. Empty PR = production.
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      # GHCR needs a lowercase path; github.repository keeps the owner's case.
      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The environment's NEXT_PUBLIC_* variables and its Server Actions key (Next embeds both at
      # build), from kit-deploy with the same token. They reach `next build` as a BuildKit secret
      # mounted at .env.production.local: in no image layer, no `docker history`, no log. Server
      # variables and secrets never come here: kit-agent puts them into the container itself.
      - name: Build variables
        id: buildenv
        env:
          KIT_DEPLOY_TOKEN: ${{ secrets.KIT_DEPLOY_TOKEN }}
        run: |
          if [ -z "$KIT_DEPLOY_TOKEN" ]; then
            echo "::error::KIT_DEPLOY_TOKEN is not set in this repository's secrets"
            exit 1
          fi
          environment=production
          if [ -n "$PR" ]; then environment=preview; fi
          umask 077
          printf 'Authorization: Bearer %s\n' "$KIT_DEPLOY_TOKEN" |
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --max-time 30 \
              --header @- \
              --header 'content-type: application/json' \
              --data "{\"environment\":\"${environment}\"}" \
              --output "$RUNNER_TEMP/build-env.json" \
              "${KIT_DEPLOY_URL}/api/v1/build-env"
          jq -r .dotenv "$RUNNER_TEMP/build-env.json" > "$RUNNER_TEMP/build.env"
          # Masked before anything else runs, in case a later step ever prints it.
          key=$(sed -n "s/^NEXT_SERVER_ACTIONS_ENCRYPTION_KEY='\(.*\)'$/\1/p" "$RUNNER_TEMP/build.env")
          echo "::add-mask::${key}"
          echo "Build variables for ${environment}: $(jq -r '.names | join(", ")' "$RUNNER_TEMP/build-env.json")"
          rm -f "$RUNNER_TEMP/build-env.json"
          # BuildKit's cache ignores a secret's content: without this, new values with the same
          # code would reuse the old `next build`. Only the hash reaches the image's history.
          echo "hash=$(sha256sum "$RUNNER_TEMP/build.env" | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            GIT_SHA=${{ env.SHA }}
            BUILD_ENV_HASH=${{ steps.buildenv.outputs.hash }}
          secret-files: build_env=${{ runner.temp }}/build.env
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        env:
          KIT_DEPLOY_TOKEN: ${{ secrets.KIT_DEPLOY_TOKEN }}
        run: |
          if [ -z "$KIT_DEPLOY_TOKEN" ]; then
            echo "::error::KIT_DEPLOY_TOKEN is not set in this repository's secrets"
            exit 1
          fi
          if [ -n "$PR" ]; then
            body="{\"sha\":\"${SHA}\",\"pr\":${PR}}"
          else
            body="{\"sha\":\"${SHA}\"}"
          fi
          # The header goes through stdin, not argv: the token never shows in the process list.
          printf 'Authorization: Bearer %s\n' "$KIT_DEPLOY_TOKEN" |
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --max-time 30 \
              --header @- \
              --header 'content-type: application/json' \
              --data "$body" \
              "${KIT_DEPLOY_URL}/api/v1/deploy"
          echo

  close-preview:
    # The PR was closed (merged or not): its preview goes. Idempotent on kit-deploy's side.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Remove preview
        env:
          KIT_DEPLOY_TOKEN: ${{ secrets.KIT_DEPLOY_TOKEN }}
        run: |
          if [ -z "$KIT_DEPLOY_TOKEN" ]; then
            echo "::error::KIT_DEPLOY_TOKEN is not set in this repository's secrets"
            exit 1
          fi
          printf 'Authorization: Bearer %s\n' "$KIT_DEPLOY_TOKEN" |
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --max-time 30 \
              --request DELETE \
              --header @- \
              --header 'content-type: application/json' \
              --data "{\"pr\":${PR}}" \
              "${KIT_DEPLOY_URL}/api/v1/preview"
          echo

  no-preview:
    # A PR from a fork or from Dependabot: no secrets, so no preview. Said, not failed.
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor == 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Skip
        run: echo "::notice title=No preview::This PR comes from a fork or from Dependabot, which get no KIT_DEPLOY_TOKEN, so kit-deploy builds no preview for it."
