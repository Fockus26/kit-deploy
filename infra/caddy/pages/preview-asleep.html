<!doctype html>
<!-- Served by Caddy (infra/caddy/kit-previews.caddy, snippet kit_preview_asleep) with a 503 for a
     sleeping preview (D017), behind the login. Caddy fills in the project and PR (`templates`,
     values already validated by lib/core). Self-contained: no app, no external request. Colors, spacing, radii and type are
     the tokens of context/COLORS.md, DESIGN_TOKENS.md and TYPOGRAPHY.md (dark default, D007). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Este preview está dormido · kit-deploy</title>
<style>
  :root {
    color-scheme: dark light;
    --background-default: #0B0D10;
    --surface: #12151A;
    --divider: #232830;
    --text-primary: #E6E8EB;
    --text-secondary: #9AA3AE;
    --primary-text: #7AB0FF;
    --spacing-sm: 8px;
    --spacing-md: 12px;
    --spacing-lg: 16px;
    --spacing-xl: 24px;
    --spacing-3xl: 48px;
    --radius-lg: 8px;
    --radius-sm: 4px;
    --font-sans: Geist, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --background-default: #F6F7F9;
      --surface: #FFFFFF;
      --divider: #E1E4E8;
      --text-primary: #0F1419;
      --text-secondary: #5B6573;
      --primary-text: #1F5FD1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--spacing-lg);
    background: var(--background-default);
    color: var(--text-primary);
    font: 400 14px/1.5 var(--font-sans);
  }
  main {
    width: 100%;
    max-width: 480px;
    padding: var(--spacing-xl);
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: var(--radius-lg);
  }
  .eyebrow {
    margin: 0 0 var(--spacing-sm);
    color: var(--text-secondary);
    font-size: 11px;
    line-height: 1.4;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 var(--spacing-md);
    font-size: 22px;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  p { margin: 0 0 var(--spacing-lg); color: var(--text-secondary); }
  a { color: var(--primary-text); text-underline-offset: 2px; }
  a:focus-visible { outline: 2px solid var(--primary-text); outline-offset: 2px; border-radius: var(--radius-sm); }
  @media (min-width: 768px) { h1 { font-size: 24px; } }
</style>
</head>
<body>
<main>
  <p class="eyebrow">{{placeholder "http.vars.kd_project"}} · PR #{{placeholder "http.vars.kd_pr"}}</p>
  <h1>Este preview está dormido</h1>
  <p>Se detuvo para dejar sitio a previews más recientes: solo cuatro pueden estar encendidos a la vez. Se despierta solo con el próximo push a su pull request.</p>
  <p><a href="https://deploy.fockus.dev/">Ir al panel de kit-deploy</a></p>
</main>
</body>
</html>
